<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; upgrade-insecure-requests">
    <title>技术博客</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="vendor/fontawesome/all.min.css">
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --surface-muted: #eef2f5;
            --text: #20242a;
            --muted: #66717f;
            --line: #dbe2ea;
            --primary: #245b7b;
            --primary-dark: #173c52;
            --accent: #c45f3c;
            --success: #287d56;
            --shadow: 0 12px 30px rgba(31, 42, 55, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(180deg, rgba(36, 91, 123, 0.08), transparent 340px),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .shell {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid rgba(219, 226, 234, 0.86);
            background: rgba(244, 246, 248, 0.9);
            backdrop-filter: blur(16px);
        }

        .header-inner {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 22px;
            align-items: center;
            min-height: 74px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary-dark);
            letter-spacing: 0;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 18px rgba(36, 91, 123, 0.24);
        }

        .search {
            position: relative;
            width: min(520px, 100%);
            justify-self: center;
        }

        .search i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .search input {
            width: 100%;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            outline: none;
            padding: 0 16px 0 42px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(36, 91, 123, 0.13);
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(196, 95, 60, 0.85);
            outline-offset: 3px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .layout {
            display: grid;
            gap: 30px;
            align-items: start;
            padding: 12px 0 56px;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 8px 24px rgba(31, 42, 55, 0.04);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 16px 12px;
            color: var(--primary-dark);
            font-weight: 750;
        }

        .content {
            display: grid;
            gap: 24px;
            min-width: 0;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            font-size: 0.84rem;
            font-weight: 760;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .meta-row span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .section-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding-top: 2px;
        }

        .section-bar h2 {
            color: var(--primary-dark);
            font-size: 1.35rem;
        }

        .result-count {
            color: var(--muted);
            font-size: 0.92rem;
        }

        .post-list {
            display: grid;
            gap: 14px;
        }

        .post-card {
            display: grid;
            grid-template-columns: 176px minmax(0, 1fr);
            gap: 18px;
            min-height: 148px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
        }

        .post-card:hover {
            border-color: rgba(36, 91, 123, 0.38);
            box-shadow: 0 12px 28px rgba(31, 42, 55, 0.1);
            transform: translateY(-2px);
        }

        .post-card > a {
            display: block;
            aspect-ratio: 3 / 2;
            background: var(--surface-muted);
        }

        .post-thumb {
            width: 100%;
            height: 100%;
            min-height: 148px;
            object-fit: cover;
            background: var(--surface-muted);
        }

        .post-body {
            display: grid;
            align-content: center;
            gap: 10px;
            min-width: 0;
            padding: 18px 20px 18px 0;
        }

        .post-title {
            color: var(--text);
            font-size: 1.16rem;
            line-height: 1.35;
        }

        .post-title a:hover {
            color: var(--primary);
        }

        .post-excerpt {
            display: -webkit-box;
            overflow: hidden;
            color: var(--muted);
            font-size: 0.94rem;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            width: max-content;
            max-width: 100%;
            min-height: 26px;
            padding: 0 9px;
            border-radius: 6px;
            background: rgba(36, 91, 123, 0.1);
            color: var(--primary-dark);
            font-size: 0.78rem;
            font-weight: 700;
        }

        .read-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: max-content;
            color: var(--primary);
            font-weight: 760;
            font-size: 0.92rem;
        }

        .empty-state {
            display: none;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.7);
            color: var(--muted);
            padding: 36px;
            text-align: center;
        }

        @media (max-width: 960px) {
            .header-inner {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 14px 0;
            }

            .search {
                justify-self: stretch;
                width: 100%;
            }
        }

        @media (max-width: 640px) {

                width: min(100% - 24px, 1180px);
            }

            }

            .post-thumb {

            }

            .post-body {
                padding: 0 18px 18px;
            }

            .section-bar {
                align-items: flex-start;
                flex-direction: column;
            }
        }

<body>
    <header class="site-header">
        <div class="shell header-inner">
            <a class="brand" href="./index.html" aria-label="返回首页">
                <span class="brand-mark"><i class="fas fa-pen-nib"></i></span>
                <span>技术博客</span>
            </a>

            <label class="search" for="search-input">
                <i class="fas fa-magnifying-glass"></i>
                <span class="visually-hidden">搜索文章</span>
                <input id="search-input" type="search" placeholder="搜索文章标题、摘要">
            </label>
        </div>
    </header>

    <main class="shell">

        <div class="layout" id="blog">

            <section class="content">
                

                <div class="section-bar">
                    <h2>全部文章</h2>
                    <span class="result-count" id="result-count">正在加载...</span>
                </div>

                <div class="post-list" id="post-list"></div>
                <div class="empty-state" id="empty-state">没有找到匹配的文章</div>
            </section>
        </div>
    </main>

    <script>
        const state = {
            posts: [],
            query: ''
        };

        const fallbackImage = 'images/img_001_001.jpg';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('search-input').addEventListener('input', event => {
                state.query = event.target.value.trim().toLowerCase();
                render();
            });
            loadPosts();
        });

        async function loadPosts() {
            try {
                const response = await fetch('posts-config.json', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('posts-config.json 加载失败');
                }

                const config = await response.json();
                state.posts = Array.isArray(config.posts) ? config.posts : [];
                render();
            } catch (error) {
                console.error(error);
                document.getElementById('result-count').textContent = '加载失败';
                document.getElementById('empty-state').style.display = 'block';
                document.getElementById('empty-state').textContent = '文章配置加载失败';
            }
        }

        function render() {
            const filteredPosts = getFilteredPosts();
            
            renderPostList(filteredPosts);
        }
        function getFilteredPosts() {
            return state.posts.filter(post => {
                const haystack = [
                    post.title,
                    post.excerpt,
                    post.date
                ].join(' ').toLowerCase();
                return haystack.includes(state.query);
            });
        }

        function renderPostList(posts) {
            const container = document.getElementById('post-list');
            const emptyState = document.getElementById('empty-state');

            document.getElementById('result-count').textContent = `${posts.length} 篇文章`;
            emptyState.style.display = posts.length ? 'none' : 'block';

            container.innerHTML = posts.map(post => `
                <article class="post-card">
                    <a href="${escapeAttribute(post.link || '#')}" aria-label="${escapeAttribute(post.title || '阅读全文')}">
                        <img class="post-thumb" src="${escapeAttribute(post.image || fallbackImage)}" alt="${escapeAttribute(post.title || '文章封面')}" width="1170" height="780" loading="lazy">
                    </a>
                    <div class="post-body">
                        <h3 class="post-title">
                            <a href="${escapeAttribute(post.link || '#')}">${escapeHtml(post.title || '无标题')}</a>
                        </h3>
                        <p class="post-excerpt">${escapeHtml(post.excerpt || '暂无摘要')}</p>
                        <div class="meta-row">
                            <span><i class="fas fa-calendar"></i>${escapeHtml(post.date || '')}</span>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function escapeAttribute(value) {
            return escapeHtml(value).replace(/`/g, '&#96;');
        }
    </script>
